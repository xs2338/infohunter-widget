<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>InfoHunter Clock Widget</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}

body{
  background:linear-gradient(160deg,#0d0015 0%,#1a0a2e 40%,#100520 100%);
  border-radius:12px;
  overflow:hidden;
}

/* ===== Layout ===== */
.widget{
  position:relative;width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
  padding:8px 16px;
}

/* ===== Aurora ambient glow ===== */
.aurora{position:absolute;inset:0;pointer-events:none}
.aurora::before{
  content:'';position:absolute;
  width:70%;height:65%;top:5%;left:15%;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(184,97,255,0.13) 0%,transparent 70%);
  animation:aurora1 8s ease-in-out infinite;
}
.aurora::after{
  content:'';position:absolute;
  width:55%;height:55%;bottom:8%;right:5%;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,142,212,0.08) 0%,transparent 70%);
  animation:aurora2 12s ease-in-out infinite;
}
@keyframes aurora1{
  0%,100%{opacity:.5;transform:scale(1)}
  50%{opacity:1;transform:scale(1.15)}
}
@keyframes aurora2{
  0%,100%{opacity:.3;transform:scale(1)}
  50%{opacity:.7;transform:scale(1.1) translate(-3%,2%)}
}

/* ===== Particles ===== */
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;will-change:transform,opacity}
.particle svg{width:100%;height:100%;display:block}

/* ===== Logo ===== */
.logo{
  position:relative;z-index:2;
  margin-bottom:0;
  display:flex;align-items:center;justify-content:center;
  gap:10px;
  transform:translateX(-14px);
}
.logo-icon{
  width:clamp(42px,10vw,60px);height:clamp(42px,10vw,60px);flex-shrink:0;
  filter:drop-shadow(0 0 12px rgba(184,97,255,0.6)) drop-shadow(0 0 30px rgba(184,97,255,0.3));
  animation:logoBreathe 4s ease-in-out infinite;
}
.logo-text{
  font-size:clamp(16px,4vw,22px);font-weight:300;letter-spacing:5px;
  color:rgba(212,160,255,0.9);
  text-shadow:0 0 20px rgba(184,97,255,0.5),0 0 40px rgba(184,97,255,0.2);
}
.logo-right{
  display:flex;flex-direction:column;align-items:center;
}
.logo-sub{
  font-size:clamp(8px,1.8vw,11px);letter-spacing:5px;
  color:rgba(212,160,255,0.4);
  text-shadow:0 0 15px rgba(184,97,255,0.2);
  margin-top:2px;
}

/* ===== Shimmer divider ===== */
.shimmer{
  position:relative;z-index:2;
  width:45%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(184,97,255,0.3),transparent);
}
.shimmer-top{margin:2px 0 18px}
.shimmer-bottom{margin:18px 0 2px}

/* ===== Time ===== */
.time-section{position:relative;z-index:2;text-align:center}
.time-hm{
  font-size:clamp(36px,8.5vw,54px);
  font-weight:200;color:#fff;letter-spacing:4px;line-height:1;
  text-shadow:
    0 0 25px rgba(184,97,255,0.5),
    0 0 50px rgba(184,97,255,0.25),
    0 0 80px rgba(184,97,255,0.1);
}
.time-sec{
  font-size:clamp(13px,2.8vw,18px);
  font-weight:200;color:rgba(255,255,255,0.28);
  vertical-align:super;margin-left:3px;
}

/* ===== Date ===== */
.date-section{
  position:relative;z-index:2;
  text-align:center;margin-top:10px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  flex-wrap:wrap;
}
.date-val{
  font-size:clamp(10px,2.2vw,13px);
  font-weight:300;color:rgba(212,160,255,0.6);letter-spacing:1.5px;
}
.date-week{
  font-size:clamp(9px,1.8vw,11px);
  padding:3px 12px;
  background:rgba(184,97,255,0.15);
  border:1px solid rgba(184,97,255,0.2);
  border-radius:12px;
  color:rgba(212,160,255,0.7);font-weight:300;
  box-shadow:0 0 12px rgba(184,97,255,0.1);
}

/* ===== Daily Quote ===== */
.quote-section{
  position:relative;z-index:2;
  margin-top:8px;
  max-width:85%;
  text-align:center;
}
.quote-text{
  font-size:clamp(11px,2.4vw,14px);
  font-weight:400;
  color:rgba(230,210,255,0.75);
  letter-spacing:1px;
  line-height:1.7;
  font-style:italic;
  text-shadow:0 0 12px rgba(184,97,255,0.25);
}
.quote-author{
  font-size:clamp(9px,1.8vw,12px);
  color:rgba(212,160,255,0.6);
  margin-top:6px;
  font-style:normal;
  letter-spacing:1.5px;
}

/* ===== Logo breathe ===== */
@keyframes logoBreathe{
  0%,100%{transform:scale(1);filter:drop-shadow(0 0 12px rgba(184,97,255,0.6)) drop-shadow(0 0 30px rgba(184,97,255,0.3))}
  50%{transform:scale(1.06);filter:drop-shadow(0 0 18px rgba(184,97,255,0.8)) drop-shadow(0 0 40px rgba(184,97,255,0.4))}
}

/* ===== Particle animations ===== */
@keyframes starFloat{
  0%{transform:translate(0,110vh) rotate(0deg) scale(0);opacity:0}
  6%{opacity:.9;transform:translate(10px,92vh) rotate(25deg) scale(1)}
  25%{transform:translate(-15px,70vh) rotate(100deg) scale(.95);opacity:.8}
  50%{transform:translate(12px,45vh) rotate(200deg) scale(.85);opacity:.7}
  75%{transform:translate(-8px,20vh) rotate(290deg) scale(.6);opacity:.5}
  100%{transform:translate(5px,-10vh) rotate(380deg) scale(.3);opacity:0}
}
@keyframes twinkle{
  0%,100%{opacity:.1;transform:scale(.6) rotate(0deg)}
  25%{opacity:.5;transform:scale(.9) rotate(10deg)}
  50%{opacity:1;transform:scale(1.3) rotate(0deg)}
  75%{opacity:.4;transform:scale(.8) rotate(-10deg)}
}
@keyframes dotPulse{
  0%,100%{opacity:0;transform:scale(.3)}
  50%{opacity:.7;transform:scale(1.2)}
}
@keyframes sparkle{
  0%,88%,100%{opacity:0;transform:scale(0) rotate(0deg)}
  94%{opacity:1;transform:scale(2) rotate(45deg)}
  96%{opacity:.3;transform:scale(1) rotate(60deg)}
}
</style>
</head>

</div>

  /* ---- Clock ---- */
  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function updateClock(){
    var now = new Date();
    $('hm').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    $('sec').textContent = pad(now.getSeconds());
    $('date').textContent = now.getFullYear() + '\u5E74' + (now.getMonth()+1) + '\u6708' + now.getDate() + '\u65E5';
    $('week').textContent = '\u661F\u671F' + DAYS[now.getDay()];

  }

  /* ---- Daily Quote (pseudo-random, deterministic per day) ---- */
  function showDailyQuote(){
    var now = new Date();
    var start = new Date(now.getFullYear(), 0, 0);
    var dayOfYear = Math.floor((now - start) / 86400000);
    // 167 is prime, gcd(167,365)=1 → cycles through all 365 indices in a year
    var index = (dayOfYear * 167 + 13) % Q.length;
    var parts = Q[index].split('|');
    $('quote').textContent = '\u201C' + parts[0] + '\u201D';
    $('author').textContent = '\u2014 ' + parts[1];
  }

  /* ---- Particles ---- */
  function createParticles(){
    var container = $('particles');

    // Helper: center-biased random (gaussian-ish, 15%-85% range)
    function cRand(){ return 15 + (Math.random()+Math.random()+Math.random())/3 * 70; }

    // Floating stars — concentrated in center
    for(var i = 0; i < 38; i++){
      var el = document.createElement('div');
      el.className = 'particle';
      var sz = 4 + Math.random() * 10;
      var col = PALETTE[Math.floor(Math.random() * PALETTE.length)];
      var x = cRand();
      var dur = 10 + Math.random() * 14;
      var delay = -(Math.random() * 24);
      var path = Math.random() > 0.25 ? STAR_PATH : DIAMOND_PATH;
      el.style.cssText = 'left:'+x+'%;width:'+sz+'px;height:'+sz+'px;animation:starFloat '+dur+'s linear '+delay+'s infinite';
      el.innerHTML = '<svg viewBox="0 0 20 20"><path d="'+path+'" fill="'+col+'"/></svg>';
      container.appendChild(el);
    }

    // Twinkling stars — concentrated in center
    for(var j = 0; j < 25; j++){
      var el2 = document.createElement('div');
      el2.className = 'particle';
      var sz2 = 2 + Math.random() * 5;
      var col2 = PALETTE[Math.floor(Math.random() * 3)];
      var x2 = cRand();
      var y2 = 10 + Math.random() * 80;
      var dur2 = 2 + Math.random() * 4;
      var delay2 = -(Math.random() * 6);
      el2.style.cssText = 'left:'+x2+'%;top:'+y2+'%;width:'+sz2+'px;height:'+sz2+'px;animation:twinkle '+dur2+'s ease-in-out '+delay2+'s infinite';
      el2.innerHTML = '<svg viewBox="0 0 20 20"><path d="'+STAR_PATH+'" fill="'+col2+'"/></svg>';
      container.appendChild(el2);
    }

    // Glow dots
    for(var k = 0; k < 12; k++){
      var el3 = document.createElement('div');
      var sz3 = 3 + Math.random() * 4;
      var x3 = cRand();
      var y3 = 10 + Math.random() * 80;
      var dur3 = 3 + Math.random() * 5;
      var delay3 = -(Math.random() * 6);
      el3.style.cssText = 'position:absolute;left:'+x3+'%;top:'+y3+'%;width:'+sz3+'px;height:'+sz3+'px;border-radius:50%;background:rgba(184,97,255,0.5);box-shadow:0 0 '+Math.round(sz3*3)+'px rgba(184,97,255,0.3);animation:dotPulse '+dur3+'s ease-in-out '+delay3+'s infinite;will-change:transform,opacity';
      container.appendChild(el3);
    }

    // Sparkle flashes
    for(var m = 0; m < 7; m++){
      var el4 = document.createElement('div');
      el4.className = 'particle';
      var sz4 = 6 + Math.random() * 6;
      var x4 = 15 + Math.random() * 70;
      var y4 = 10 + Math.random() * 80;
      var dur4 = 8 + Math.random() * 15;
      var delay4 = -(Math.random() * 20);
      el4.style.cssText = 'left:'+x4+'%;top:'+y4+'%;width:'+sz4+'px;height:'+sz4+'px;animation:sparkle '+dur4+'s ease-in-out '+delay4+'s infinite';
      el4.innerHTML = '<svg viewBox="0 0 20 20"><path d="'+STAR_PATH+'" fill="#fff"/></svg>';
      container.appendChild(el4);
    }
  }

  /* ---- Init ---- */
  updateClock();
  showDailyQuote();
  createParticles();
  setInterval(updateClock, 1000);
})();
